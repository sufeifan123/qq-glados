name: GLaDOS Checkin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run GLaDOS Checkin
        run: python checkin.py
        env:
          # 必须与生成 gld:sess 的登录浏览器一致。
          GLADOS_USER_AGENT: ${{ vars.GLADOS_USER_AGENT }}
          # 独立账号：仅非空 Cookie 会启用；全部为空时继续使用旧 GLADOS_COOKIE。
          # 新增账号时复制一组映射，并将后缀改为新的固定标识。
          #账号：290128
          GLADOS_COOKIE_U290: ${{ secrets.GLADOS_COOKIE_U290 }}
          GLADOS_NAME_U290: ${{ vars.GLADOS_NAME_U290 || '账号290' }}
          #账号：156703
          GLADOS_COOKIE_U156: ${{ secrets.GLADOS_COOKIE_U156 }}
          GLADOS_NAME_U156: ${{ vars.GLADOS_NAME_U156 || '账号156' }}


          #微信通知
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_APPSECRET: ${{ secrets.WECHAT_APPSECRET }}
          WECHAT_TEMPLATE_ID: ${{ secrets.WECHAT_TEMPLATE_ID }}
          WECHAT_OPENID: ${{ secrets.WECHAT_OPENID }}

